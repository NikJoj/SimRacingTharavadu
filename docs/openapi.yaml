  /api/live:
    get:
      tags:
        - Assetto Proxy
      summary: Live timing data from Assetto server
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - basic
              - leaderboard
          description: Omit to get both. basic=session info, leaderboard=driver positions
      responses:
        "200":
          description: Success (5s cache)
          content:
            application/json:
              schema:
                description: Upstream JSON is passed through without a fixed schema. /api/live without type wraps responses in
                  basic and leaderboard.
        "400":
