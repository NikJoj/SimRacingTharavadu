    get:
      tags:
        - Portal Data
      summary: Read the last saved SimGrid snapshot
      description: Public, no-store response used by standings, schedule, and the championship portal registration
        summary. Does not contact SimGrid or initialize tables. Returns null snapshot before the first sync or
        after the league championship changes.
      parameters:
        - in: query
          name: leagueId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Saved snapshot or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/SimGridSnapshot"
                  syncedAt:
                    type: string
                    format: date-time
                    nullable: true
                  revision:
                    type: integer
        "400":
          description: Invalid league ID or SimGrid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
