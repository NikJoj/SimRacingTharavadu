  /api/race-store:
    get:
      tags:
        - Race Archive
      summary: List leagues, list races for a league, or fetch a specific race
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum:
              - leagues
          description: Use action=leagues to list all leagues that have stored races
        - in: query
          name: leagueId
          schema:
            type: integer
          description: League database ID
        - in: query
          name: timestamp
          schema:
            type: integer
          description: Race timestamp in ms — returns full result_data when combined with leagueId
        - in: query
          name: league
          schema:
            type: string
          description: Legacy storage key, used only when leagueId is absent. Also reads backfilled social events, e.g.
            event:9.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - success
                      - leagues
                    properties:
                      success:
                        type: boolean
                      leagues:
                        type: array
                        items:
                          type: object
                          properties:
                            league_id:
                              type: integer
                              nullable: true
                            key:
                              type: string
                            name:
                              type: string
                  - type: object
                    required:
                      - success
                      - leagueId
                      - league
                      - count
                      - races
                    properties:
                      success:
                        type: boolean
                      leagueId:
                        type: integer
                        nullable: true
                      league:
                        type: string
                      count:
                        type: integer
                      races:
                        type: array
                        items:
                          $ref: "#/components/schemas/RaceResultMeta"
                  - $ref: "#/components/schemas/RaceResultFull"
        "400":
          description: Missing or invalid league reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Race not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: action=leagues lists distinct archive groups, including social event keys with league_id=null.
        Otherwise provide leagueId or the legacy league storage key. timestamp selects one full result.
        eventId is not a supported filter, and event_id is not returned in list metadata.
      operationId: getRaceStore
    post:
      tags:
        - Race Archive
      summary: Store latest race or sync multiple races from Assetto server
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum:
              - store
              - sync
        - in: query
          name: leagueId
          schema:
            type: integer
          description: Required for action=store
        - in: query
          name: league
          schema:
            type: string
          description: Legacy storage key for action=store, when leagueId is absent.
      requestBody:
        content:
          application/json:
            schema:
              description: Required for action=sync
              type: object
              required:
                - races
              properties:
                leagueId:
                  type: integer
                races:
                  type: array
                  items:
                    type: object
                    required:
                      - results_json_url
                      - track
                      - date
                    properties:
                      results_json_url:
                        type: string
                      results_page_url:
                        type: string
                      track:
                        type: string
                      date:
                        type: string
                      session_type:
                        type: string
                        default: RACE
                  minItems: 1
                league:
                  type: string
                  description: Legacy storage key, used when leagueId is absent.
              anyOf:
                - required:
                    - leagueId
                - required:
                    - league
      responses:
        "200":
          description: store returns race metadata; sync returns results.success and results.failed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - leagueId
                  - league
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  leagueId:
                    type: integer
                    nullable: true
                  league:
                    type: string
                  track:
                    type: string
                  date:
                    type: string
                  race_timestamp:
                    oneOf:
                      - type: integer
                        nullable: true
                      - type: string
                        pattern: ^-?[0-9]+$
                    description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
                      unavailable.
                  results:
                    type: object
                    properties:
                      success:
                        type: array
                        items:
                          type: object
                          properties:
                            track:
                              type: string
                            date:
                              type: string
                            race_timestamp:
                              oneOf:
                                - type: integer
                                  nullable: true
                                - type: string
                                  pattern: ^-?[0-9]+$
                              description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
                                unavailable.
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            track:
                              type: string
                            date:
                              type: string
                            error:
                              type: string
        "400":
          description: Missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No race found on Assetto server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: store fetches the latest upstream RACE; sync fetches the selected URLs. Existing league/timestamp
        rows are preserved, then indexed. sync reports per-race failures while returning HTTP 200; inspect
        results.failed. Writes and indexing are sequential, not a batch transaction.
      operationId: postRaceStore
    options:
      tags:
        - Race Archive
      operationId: optionsRaceStore
      summary: Handle preflight request
      security: []
      responses:
        "200":
          description: Empty preflight response
