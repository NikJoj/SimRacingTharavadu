        "500":
          description: Database failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getSimgrid
    post:
      tags:
        - Admin
      summary: Preview or confirm a manual SimGrid sync
      security:
        - AdminSession: []
      description: |
        Supports solo LMU championships. The league's simgrid_url selects the
        championship; the client cannot provide arbitrary upstream URLs.
        Preview is read-only. Confirm re-fetches and validates the complete
        snapshot against hash and revision, then atomically saves it and upserts
        provider-owned registrations. Missing imported drivers become inactive;
        local-only registrations are untouched. Scores already include SimGrid
        adjustments. Detailed race results and lap times are not imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - action
                    - leagueId
                  properties:
                    action:
                      type: string
                      enum:
                        - preview
                    leagueId:
                      type: integer
                      minimum: 1
                - type: object
                  required:
                    - action
                    - leagueId
                    - hash
                    - revision
                  properties:
                    action:
                      type: string
                      enum:
                        - sync
                    leagueId:
                      type: integer
                      minimum: 1
                    hash:
                      type: string
                    revision:
                      type: integer
                      minimum: 0
      responses:
        "200":
          description: Preview or completed sync
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SimGridPreview"
                  - $ref: "#/components/schemas/SimGridSyncResult"
        "400":
          description: Invalid JSON, action, league ID, or championship URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale preview or concurrent update. Preview again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unsupported simulator or team championship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: SimGrid rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database or candidate indexing failure. Snapshot publication is atomic, but a subsequent
            candidate rebuild may fail after publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream failure or incomplete/unrecognized data; no sync performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SIMGRID_API_TOKEN or JWT_SECRET missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: postSimgrid
    options:
      tags:
        - Portal Data
      operationId: optionsSimgrid
      summary: Handle preflight request
      security: []
      responses:
        "204":
          description: Empty preflight response
