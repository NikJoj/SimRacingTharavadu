      summary: Get the authenticated driver's consolidated profile and race history
      description: Returns only the authenticated driver profile and mapped history, newest first (unknown dates
        last). raceResultId instead returns the entire archived race JSON if this driver has a mapped entry in
        that race. The race payload includes the other classified drivers. Unmapped names and separate event
        leaderboard rows are not part of this history. There is no simulator filter, progress metric, or
        rating yet.
      parameters:
