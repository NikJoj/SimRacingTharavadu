# API contract: update alongside api/ handlers. See docs/README.md.
openapi: 3.0.3
info:
  title: SimRacingTharavadu Portal API
  version: 2.1.0
  description: >-
    REST API for the SimRacingTharavadu community portal, implemented by Azure Functions v4 and Neon
    PostgreSQL. Reviewed against the repository on 2026-09-16.


    Azure Functions use anonymous host authorization. Application-level admin authentication is enforced only
    by POST /api/simgrid, POST /api/simgrid-results, and GET/POST /api/driver-mappings. /api/driver-profile
    requires the signed driver cookie. The other operations have no application-level session check in the
    current handlers.


    Database backfills are not additional HTTP endpoints. Social results can be read through the legacy
    archive key (for example league=event:9) and mapped driver history. No driver rating, pace, consistency,
    raw XML export, or eventId archive filter is implemented.


    Result JSON varies by simulator and importer. Detailed laps and sectors may be absent. A missing value or
    empty Penalties array is not evidence of a clean race. Do not compare timing values across different
    tracks or simulators without normalization.
servers:
  - url: /
    description: Same origin as the hosted specification; includes the /api paths below
  - url: http://localhost:7071
    description: Local Azure Functions
tags:
  - name: Portal Data
    description: Events, leagues, leaderboard — backed by Neon PostgreSQL
  - name: Race Archive
    description: Persistent race result storage in Neon PostgreSQL (replaces Vercel Blob)
  - name: Assetto Proxy
    description: Pass-through proxy to the Assetto Corsa server API (CORS bypass)
  - name: Admin
    description: Admin authentication and poster management
  - name: Driver Portal
    description: Discord login and the authenticated driver profile
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: header
      name: X-SRT-Admin-Token
      description: Raw token issued by POST /api/login-auth (custom HMAC token, not JWT; no Bearer prefix). Avoid
        Authorization through Azure SWA, which may overwrite it. Direct/local clients may still use
        Authorization Bearer as a fallback.
    DriverSession:
      type: apiKey
      in: cookie
      name: srt_driver_session
      description: Signed HttpOnly, Secure, SameSite=Lax cookie issued after approved Discord login; expires after
        seven days. Use the website login flow. Cross-origin Swagger UI cannot set this HttpOnly cookie.
  schemas:
    SimGridDriver:
      type: object
      required:
        - id
        - userId
        - name
        - carNumber
        - className
      properties:
        id:
          type: string
          description: Stable SimGrid registration ID
        userId:
          type: string
        name:
          type: string
        carNumber:
          type: string
        className:
          type: string
    SimGridStanding:
      allOf:
        - $ref: "#/components/schemas/SimGridDriver"
        - type: object
          required:
            - car
            - position
            - points
            - score
            - penalties
            - adjustment
            - adjustmentReason
          properties:
            car:
              type: string
            position:
              type: number
              description: Official class position from SimGrid
            points:
              type: number
            score:
              type: number
              description: Official adjusted championship score. Do not subtract penalties again.
            penalties:
              type: number
            adjustment:
              type: number
            adjustmentReason:
              type: string
    SimGridRace:
      type: object
      required:
        - id
        - name
        - track
        - startsAt
        - resultsAvailable
        - publishedAt
        - ended
      properties:
        id:
          type: string
        name:
          type: string
        track:
          type: string
        startsAt:
          type: string
          format: date-time
        resultsAvailable:
          type: boolean
          description: Publication status only; detailed results are not imported
        publishedAt:
          type: string
          format: date-time
          nullable: true
        ended:
          type: boolean
    SimGridSnapshot:
      type: object
      required:
        - championshipId
        - name
        - sim
        - capacity
        - drivers
        - standings
        - races
        - resultsDetailAvailable
      properties:
        championshipId:
          type: string
          example: "26866"
        name:
          type: string
        sim:
          type: string
          enum:
            - Le Mans Ultimate
        capacity:
          type: number
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/SimGridDriver"
        standings:
          type: array
          items:
            $ref: "#/components/schemas/SimGridStanding"
        races:
          type: array
          items:
            $ref: "#/components/schemas/SimGridRace"
        resultsDetailAvailable:
          type: boolean
          enum:
            - false
    SimGridDiff:
      type: object
      required:
        - added
        - updated
        - removed
      properties:
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
    SimGridChanges:
      type: object
      required:
        - drivers
        - standings
        - races
      properties:
        drivers:
          $ref: "#/components/schemas/SimGridDiff"
        standings:
          $ref: "#/components/schemas/SimGridDiff"
        races:
          $ref: "#/components/schemas/SimGridDiff"
    SimGridPreview:
      type: object
      required:
        - snapshot
        - hash
        - revision
        - changes
        - syncedAt
      properties:
        snapshot:
          $ref: "#/components/schemas/SimGridSnapshot"
        hash:
          type: string
          description: SHA-256 fingerprint required for confirmation
        revision:
          type: integer
          description: Saved revision required for confirmation
        changes:
          $ref: "#/components/schemas/SimGridChanges"
        syncedAt:
          type: string
          format: date-time
          nullable: true
    SimGridSyncResult:
      type: object
      required:
        - success
        - changes
        - revision
        - syncedAt
      properties:
        success:
          type: boolean
        changes:
          $ref: "#/components/schemas/SimGridChanges"
        revision:
          type: integer
        syncedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sim:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - upcoming
            - ongoing
            - closed
          nullable: true
        track:
          type: string
          nullable: true
        start_date:
          type: string
          nullable: true
          description: "Stored text: may be date-only or an ISO timestamp."
        end_date:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        drivers:
          type: integer
          nullable: true
          description: Recorded event count; its meaning depends on the event/import. May be null when unknown.
        max_drivers:
          type: integer
          nullable: true
        rounds:
          type: integer
          nullable: true
        season:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        track_mod:
          type: string
          nullable: true
        car_mod:
          type: string
          nullable: true
        practice_server:
          type: string
          nullable: true
        car_options:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    League:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sim:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - upcoming
            - ongoing
            - closed
          nullable: true
        start_date:
          type: string
          nullable: true
        end_date:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        season:
          type: string
          nullable: true
        championship_id:
          type: string
          nullable: true
        simgrid_url:
          type: string
          format: uri
          nullable: true
        blob_store:
          type: string
          deprecated: true
          description: Legacy read-only compatibility field
          nullable: true
        drivers:
          type: integer
          nullable: true
        max_drivers:
          type: integer
          nullable: true
        rounds:
          type: integer
          nullable: true
        track:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        car_options:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    LeaderboardEntry:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
          nullable: true
        race:
          type: string
          example: Race 1
          nullable: true
        position:
          type: integer
          nullable: true
        driver:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        team:
          type: string
          nullable: true
        points:
          oneOf:
            - type: number
              nullable: true
            - type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: Stored points, or null when points were not assigned. Neon may serialize DECIMAL as a string.
        time:
          type: string
          example: 1:44.218
          nullable: true
        gap:
          type: string
          example: "+0.301"
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    Registration:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          nullable: true
        driver_tag:
          type: string
        discord:
          type: string
          nullable: true
        car_class:
          type: string
          nullable: true
        event:
          type: string
          nullable: true
        league_id:
          type: integer
          nullable: true
        car_number:
          type: string
          nullable: true
        penalty_points:
          type: integer
          default: 0
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        driver_profile_id:
          type: integer
          nullable: true
        simgrid_registration_id:
          type: string
          nullable: true
        simgrid_active:
          type: boolean
    RaceResultMeta:
      type: object
      description: Race result metadata (without full result_data for list responses)
      properties:
        id:
          type: integer
        league:
          type: string
        league_id:
          type: integer
          nullable: true
        track:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
        race_timestamp:
          oneOf:
            - type: integer
              nullable: true
            - type: string
              pattern: ^-?[0-9]+$
          description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
            unavailable.
        results_json_url:
          type: string
          nullable: true
        results_page_url:
          type: string
          nullable: true
        session_type:
          type: string
          example: RACE
          nullable: true
        stored_at:
          type: string
          format: date-time
          nullable: true
    RaceResultFull:
      type: object
      required:
        - success
        - leagueId
        - league
        - timestamp
        - metadata
        - data
      properties:
        success:
          type: boolean
        leagueId:
          type: integer
          nullable: true
        league:
          type: string
        timestamp:
          type: string
          description: Echoes the timestamp query parameter.
        metadata:
          type: object
          properties:
            track:
              type: string
              nullable: true
            session_date:
              type: string
              format: date-time
              nullable: true
            race_timestamp:
              oneOf:
                - type: integer
                  nullable: true
                - type: string
                  pattern: ^-?[0-9]+$
              description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
                unavailable.
            session_type:
              type: string
              nullable: true
            results_json_url:
              type: string
              nullable: true
            results_page_url:
              type: string
              nullable: true
            stored_at:
              type: string
              format: date-time
              nullable: true
        data:
          $ref: "#/components/schemas/RaceData"
    Success:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
    RaceData:
      type: object
      additionalProperties: true
      description: Assetto result JSON or normalized LMU result JSON. Fields depend on the importer; optional
        backfill fields are not produced by the standard LMU upload.
      properties:
        source:
          type: string
        sourceFile:
          type: string
        Type:
          type: string
        Date:
          type: string
        TrackName:
          type: string
        TrackConfig:
          type: string
        TotalLaps:
          type: integer
        Result:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              DriverName:
                type: string
              Position:
                type: integer
              GridPosition:
                type: integer
                nullable: true
              CarModel:
                type: string
              CarClass:
                type: string
              CarNumber:
                type: string
              TeamName:
                type: string
              NumLaps:
                type: integer
              BestLap:
                type: integer
                nullable: true
                description: Milliseconds
              TotalTime:
                type: integer
                nullable: true
                description: Milliseconds; meaning depends on importer. Standard LMU upload uses the final lap elapsed
                  timestamp; social backfill uses official FinishTime.
              FinishStatus:
                type: string
              Pitstops:
                type: integer
        Laps:
          type: array
          items:
            type: object
            additionalProperties: true
        Penalties:
          type: array
          items:
            type: object
            additionalProperties: true
        PenaltyEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        Events:
          type: array
          items:
            type: object
            additionalProperties: true
        DataQuality:
          type: object
          additionalProperties: true
        EventName:
          type: string
        eventId:
          type: integer
        eventCategory:
          type: string
    DriverProfile:
      type: object
      required:
        - id
        - display_name
        - status
        - avatarUrl
      properties:
        id:
          type: integer
        display_name:
          type: string
        discord_username:
          type: string
          nullable: true
        discord_user_id:
          type: string
          nullable: true
        discord_global_name:
          type: string
          nullable: true
        discord_avatar_hash:
          type: string
          nullable: true
        status:
          type: string
        avatarUrl:
          type: string
          description: Empty string if no avatar.
    DriverStats:
      type: object
      required:
        - races
        - wins
        - podiums
        - averageFinish
        - completedLaps
      properties:
        races:
          type: integer
        wins:
          type: integer
        podiums:
          type: integer
        averageFinish:
          type: number
          nullable: true
        completedLaps:
          type: integer
      description: Computed across all indexed entries mapped to this driver. No simulator/class/competition filter
        or rating is currently exposed. One entry counts as one race, including zero-lap entries. Finishes use
        stored overall position; current numeric conversion treats a null position as zero in averageFinish.
    DriverHistoryEntry:
      type: object
      properties:
        position:
          type: integer
          nullable: true
        grid_position:
          type: integer
          nullable: true
        car_number:
          type: string
          nullable: true
        car_model:
          type: string
          nullable: true
        car_class:
          type: string
          nullable: true
        team_name:
          type: string
          nullable: true
        laps:
          type: integer
          nullable: true
        best_lap:
          oneOf:
            - type: integer
              nullable: true
            - type: string
              pattern: ^-?[0-9]+$
          description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
            unavailable.
        total_time:
          oneOf:
            - type: integer
              nullable: true
            - type: string
              pattern: ^-?[0-9]+$
          description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
            unavailable.
        finish_status:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        session_date:
          type: string
          format: date-time
          nullable: true
        session_type:
          type: string
          nullable: true
        league_id:
          type: integer
          nullable: true
        race_timestamp:
          oneOf:
            - type: integer
              nullable: true
            - type: string
              pattern: ^-?[0-9]+$
          description: Milliseconds. PostgreSQL BIGINT values may be serialized as decimal strings; null means
            unavailable.
        race_result_id:
          type: integer
        competition:
          type: string
          description: League name, or SRT Race for results without a league. Event display names are not yet joined.
    DriverProfileResponse:
      type: object
      required:
        - profile
        - stats
        - history
      properties:
        profile:
          $ref: "#/components/schemas/DriverProfile"
        stats:
          $ref: "#/components/schemas/DriverStats"
        history:
          type: array
          items:
            $ref: "#/components/schemas/DriverHistoryEntry"
    DriverRaceResponse:
      type: object
      required:
        - race
      properties:
        race:
          type: object
          properties:
            result_data:
              $ref: "#/components/schemas/RaceData"
            track:
              type: string
              nullable: true
            session_date:
              type: string
              format: date-time
              nullable: true
            session_type:
              type: string
              nullable: true
            competition:
              type: string
    MappingProfile:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
        discord_username:
          type: string
          nullable: true
        discord_user_id:
          type: string
          nullable: true
        discord_global_name:
          type: string
          nullable: true
        discord_avatar_hash:
          type: string
          nullable: true
        status:
          type: string
        simgrid_user_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        alias_count:
          type: integer
        race_count:
          type: integer
    DriverCandidate:
      type: object
      properties:
        id:
          type: integer
        normalized_name:
          type: string
        sample_name:
          type: string
        appearances:
          type: integer
        sources:
          type: array
          items:
            type: string
        status:
          type: string
        driver_profile_id:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
