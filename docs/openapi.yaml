openapi: 3.0.3

info:
  title: SimRacingTharavadu Portal API
  version: "2.0"
  description: |
    REST API for the SimRacingTharavadu sim racing community portal.
    Hosted on Azure Static Web Apps + Azure Functions (Node.js v4).
    Database: Neon PostgreSQL (serverless).

    All deployed functions currently accept anonymous Azure Function requests.
    `POST /api/login-auth` issues and validates the dashboard's short-lived
    HMAC-SHA256 session token; it is not an API-wide authorization mechanism.
    SimGrid POST requests are an exception: they validate this token server-side.

    Race archive requests use `leagueId`, the Neon `leagues.id` value. The
    legacy `blob_store` response field is read-only compatibility data and is
    not required for new leagues.

servers:
  - url: https://your-site.azurestaticapps.net
    description: Production (Azure Static Web Apps)
  - url: http://localhost:7071
    description: Local development (Azure Functions Core Tools)

tags:
  - name: Portal Data
    description: Events, leagues, leaderboard — backed by Neon PostgreSQL
  - name: Race Archive
    description: Persistent race result storage in Neon PostgreSQL (replaces Vercel Blob)
  - name: Assetto Proxy
    description: Pass-through proxy to the Assetto Corsa server API (CORS bypass)
  - name: Admin
    description: Admin authentication and poster management

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: header
      name: X-SRT-Admin-Token
      description: Raw token issued by POST /api/login-auth (custom HMAC token, not JWT; no Bearer prefix). Avoid Authorization through Azure SWA, which may overwrite it. Direct/local clients may still use Authorization Bearer as a fallback.
  schemas:

    SimGridDriver:
      type: object
      required: [id, userId, name, carNumber, className]
      properties:
        id: { type: string, description: Stable SimGrid registration ID }
        userId: { type: string }
        name: { type: string }
        carNumber: { type: string }
        className: { type: string }

    SimGridStanding:
      allOf:
        - $ref: '#/components/schemas/SimGridDriver'
        - type: object
          required: [car, position, points, score, penalties, adjustment, adjustmentReason]
          properties:
            car: { type: string }
            position: { type: number, description: Official class position from SimGrid }
            points: { type: number }
            score: { type: number, description: Official adjusted championship score. Do not subtract penalties again. }
            penalties: { type: number }
            adjustment: { type: number }
            adjustmentReason: { type: string }

    SimGridRace:
      type: object
      required: [id, name, track, startsAt, resultsAvailable, publishedAt, ended]
      properties:
        id: { type: string }
        name: { type: string }
        track: { type: string }
        startsAt: { type: string, format: date-time }
        resultsAvailable: { type: boolean, description: Publication status only; detailed results are not imported }
        publishedAt: { type: string, format: date-time, nullable: true }
        ended: { type: boolean }

    SimGridSnapshot:
      type: object
      required: [championshipId, name, sim, capacity, drivers, standings, races, resultsDetailAvailable]
      properties:
        championshipId: { type: string, example: '26866' }
        name: { type: string }
        sim: { type: string, enum: [Le Mans Ultimate] }
        capacity: { type: number }
        drivers:
          type: array
          items: { $ref: '#/components/schemas/SimGridDriver' }
        standings:
          type: array
          items: { $ref: '#/components/schemas/SimGridStanding' }
        races:
          type: array
          items: { $ref: '#/components/schemas/SimGridRace' }
        resultsDetailAvailable: { type: boolean, enum: [false] }

    SimGridDiff:
      type: object
      required: [added, updated, removed]
      properties:
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer }

    SimGridChanges:
      type: object
      required: [drivers, standings, races]
      properties:
        drivers: { $ref: '#/components/schemas/SimGridDiff' }
        standings: { $ref: '#/components/schemas/SimGridDiff' }
        races: { $ref: '#/components/schemas/SimGridDiff' }

    SimGridPreview:
      type: object
      required: [snapshot, hash, revision, changes, syncedAt]
      properties:
        snapshot: { $ref: '#/components/schemas/SimGridSnapshot' }
        hash: { type: string, description: SHA-256 fingerprint required for confirmation }
        revision: { type: integer, description: Saved revision required for confirmation }
        changes: { $ref: '#/components/schemas/SimGridChanges' }
        syncedAt: { type: string, format: date-time, nullable: true }

    SimGridSyncResult:
      type: object
      required: [success, changes, revision, syncedAt]
      properties:
        success: { type: boolean }
        changes: { $ref: '#/components/schemas/SimGridChanges' }
        revision: { type: integer }
        syncedAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    Event:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        sim:         { type: string }
        status:      { type: string, enum: [upcoming, ongoing, closed] }
        track:       { type: string }
        start_date:  { type: string }
        end_date:    { type: string }
        format:      { type: string }
        drivers:     { type: integer }
        max_drivers: { type: integer }
        rounds:      { type: integer }
        season:      { type: string }
        description: { type: string }
        track_mod:   { type: string }
        car_mod:     { type: string }
        practice_server: { type: string }
        car_options: { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    League:
      type: object
      properties:
        id:             { type: integer }
        name:           { type: string }
        sim:            { type: string }
        status:         { type: string, enum: [upcoming, ongoing, closed] }
        start_date:     { type: string }
        end_date:       { type: string }
        format:         { type: string }
        season:         { type: string }
        championship_id: { type: string }
        simgrid_url:    { type: string, format: uri }
        blob_store:     { type: string, deprecated: true, description: "Legacy read-only compatibility field" }
        drivers:        { type: integer }
        max_drivers:    { type: integer }
        rounds:         { type: integer }
        track:          { type: string }
        description:    { type: string }
        car_options:    { type: string }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      properties:
        id:       { type: integer }
        event_id: { type: integer }
        race:     { type: string, example: "Race 1" }
        position: { type: integer }
        driver:   { type: string }
        tag:      { type: string }
        team:     { type: string }
        points:   { type: number }
        time:     { type: string, example: "1:44.218" }
        gap:      { type: string, example: "+0.301" }
        created_at: { type: string, format: date-time }

    Registration:
      type: object
      properties:
        id:             { type: integer }
        timestamp:      { type: string }
        driver_tag:     { type: string }
        discord:        { type: string }
        car_class:      { type: string }
        event:          { type: string }
        league_id:      { type: integer, nullable: true }
        car_number:     { type: string, nullable: true }
        penalty_points: { type: integer, default: 0 }
        created_at:     { type: string, format: date-time }

    RaceResultMeta:
      type: object
      description: Race result metadata (without full result_data for list responses)
      properties:
        id:               { type: integer }
        league:           { type: string }
        league_id:        { type: integer, nullable: true }
        track:            { type: string }
        date:             { type: string, format: date-time }
        race_timestamp:   { type: integer, description: "Unix timestamp in milliseconds" }
        results_json_url: { type: string }
        results_page_url: { type: string }
        session_type:     { type: string, example: "RACE" }
        stored_at:        { type: string, format: date-time }

    RaceResultFull:
      allOf:
        - $ref: '#/components/schemas/RaceResultMeta'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              description: Full race result JSON as returned by Assetto Corsa server

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  /api/discord-auth:
    get:
      tags: [Driver Portal]
      summary: Start or complete Discord OAuth, inspect login state, or sign out
      description: |
        `action=login` starts Discord's authorization-code flow with the
        `identify` scope. `action=callback` verifies state, exchanges the code
        server-side, and binds the immutable Discord user ID only to one exact
        pre-approved username. `action=me` is a public login-state check and
        `action=logout` clears the signed HttpOnly driver session.
      parameters:
        - in: query
          name: action
          schema: { type: string, enum: [login, callback, me, logout] }
      responses:
        '200': { description: Login-state response }
        '302': { description: Redirect to Discord or the driver profile }
        '401': { description: Invalid OAuth state or session }
        '503': { description: Discord OAuth environment variables are missing }

  /api/driver-profile:
    get:
      tags: [Driver Portal]
      summary: Get the authenticated driver's consolidated profile and race history
      description: Requires the signed HttpOnly driver session. With raceResultId,
        returns an individual mapped race result for the same driver.
      parameters:
        - in: query
          name: raceResultId
          schema: { type: integer }
      responses:
        '200': { description: Profile/history or one accessible race result }
        '400': { description: Invalid race result ID }
        '401': { description: Missing, expired, or unlinked driver session }
        '404': { description: Race is not mapped to this driver }

  /api/driver-mappings:
    get:
      tags: [Admin]
      summary: List driver identity profiles, discovered names, and mapping audit
      security:
        - AdminSession: []
      responses:
        '200': { description: Current internal identity-mapping workspace }
        '401': { description: Invalid or expired admin session }
    post:
      tags: [Admin]
      summary: Manage driver mappings and pre-link Discord server members
      security:
        - AdminSession: []
      description: |
        `index` rebuilds the searchable race-entry index without changing archived
        race JSON. `assign` creates or selects a driver profile and approves the
        discovered name as a global alias. `unassign` reverses that alias link.
        `update-profile` edits the administrative display name and expected Discord
        username. `preview-discord-members` securely fetches non-bot members through
        the configured SRT bot and suggests exact username matches without writing.
        `confirm-discord-members` revalidates server membership and binds selected
        immutable Discord user IDs, allowing those drivers to sign in immediately.
        A link can target an existing profile or an unmatched discovered racing
        name; the latter creates the profile, approves the alias, and backfills
        historical race entries and registrations in the same operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [index, assign, unassign, update-profile, review-claim, preview-discord-members, confirm-discord-members, unlink-discord-member] }
                candidateId: { type: integer }
                profileId: { type: integer }
                claimId: { type: integer }
                decision: { type: string, enum: [approve, reject] }
                displayName: { type: string }
                discordUsername: { type: string }
                discordUserId: { type: string, pattern: '^\\d+$' }
                links:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [memberId]
                    oneOf:
                      - required: [profileId]
                      - required: [candidateId]
                    properties:
                      memberId: { type: string, pattern: '^\\d+$' }
                      profileId: { type: integer }
                      candidateId: { type: integer }
      responses:
        '200': { description: Operation completed }
        '400': { description: Invalid action or fields }
        '401': { description: Invalid or expired admin session }
        '404': { description: Candidate or profile not found }
        '409': { description: Discord username or provider identity conflict }
        '429': { description: Discord rate limit reached }
        '502': { description: Discord bot request or permission failure }
        '503': { description: Discord bot token or guild ID is missing }
        '500': { description: Mapping operation failed }

  /api/simgrid-results:
    post:
      tags: [Admin]
      summary: Preview or confirm an uploaded LMU XML race result
      security:
        - AdminSession: []
      description: |
        Accepts an LMU/rFactor XML result file up to 8 MB. Preview normalizes
        the Race session and validates its timestamp and track against a race
        in the saved SimGrid snapshot. Confirm requires the preview hash and
        upserts the selected league/race slot in Neon. Raw XML, telemetry, and
        incidents are not persisted. SimGrid remains authoritative for points
        and stewarding adjustments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [action, leagueId, raceId, file]
              properties:
                action: { type: string, enum: [preview, sync] }
                leagueId: { type: integer, minimum: 1 }
                raceId: { type: string, pattern: '^\\d+$' }
                hash: { type: string, description: Required for sync; returned by preview }
                file: { type: string, format: binary }
      responses:
        '200': { description: Read-only preview or completed race upsert }
        '400': { description: Missing selection, invalid filename, upload, or XML }
        '401': { description: Invalid or expired admin session }
        '404': { description: League not found }
        '409': { description: Championship not synced or preview changed }
        '422': { description: Invalid results or date/track mismatch }
        '500': { description: Database failure; existing race retained }

  /api/simgrid:
    get:
      tags: [Portal Data]
      summary: Read the last saved SimGrid snapshot
      description: Public, no-store response used by standings, schedule, and the championship portal registration summary. Does not contact SimGrid or initialize tables. Returns null snapshot before the first sync or after the league championship changes.
      parameters:
        - in: query
          name: leagueId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Saved snapshot or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/SimGridSnapshot'
                  syncedAt: { type: string, format: date-time, nullable: true }
                  revision: { type: integer }
        '400': { description: Invalid league ID or SimGrid URL }
        '404': { description: League not found }
        '500': { description: Database failure }
    post:
      tags: [Admin]
      summary: Preview or confirm a manual SimGrid sync
      security:
        - AdminSession: []
      description: |
        Supports solo LMU championships. The league's simgrid_url selects the
        championship; the client cannot provide arbitrary upstream URLs.
        Preview is read-only. Confirm re-fetches and validates the complete
        snapshot against hash and revision, then atomically saves it and upserts
        provider-owned registrations. Missing imported drivers become inactive;
        local-only registrations are untouched. Scores already include SimGrid
        adjustments. Detailed race results and lap times are not imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, leagueId]
                  properties:
                    action: { type: string, enum: [preview] }
                    leagueId: { type: integer, minimum: 1 }
                - type: object
                  required: [action, leagueId, hash, revision]
                  properties:
                    action: { type: string, enum: [sync] }
                    leagueId: { type: integer, minimum: 1 }
                    hash: { type: string }
                    revision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Preview or completed sync
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SimGridPreview'
                  - $ref: '#/components/schemas/SimGridSyncResult'
        '400': { description: Invalid JSON, action, league ID, or championship URL }
        '401': { description: Invalid or expired admin session }
        '404': { description: League not found }
        '409': { description: Stale preview or concurrent update. Preview again. }
        '422': { description: Unsupported simulator or team championship }
        '429': { description: SimGrid rate limit reached }
        '500': { description: Database failure; previous snapshot retained }
        '502': { description: Upstream failure or incomplete/unrecognized data; no sync performed }
        '503': { description: SIMGRID_API_TOKEN or JWT_SECRET missing }

  # ── /api/home ───────────────────────────────────────────────────────────────
  /api/home:
    get:
      tags: [Portal Data]
      summary: Get all home page data in one call
      description: |
        Returns events, leagues, and leaderboard in a single response.
        Used by the public homepage to minimise requests.
        Also runs idempotent DB schema migrations on cold start.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:      { type: array, items: { $ref: '#/components/schemas/Event' } }
                  leagues:     { type: array, items: { $ref: '#/components/schemas/League' } }
                  leaderboard: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ── /api/events ─────────────────────────────────────────────────────────────
  /api/events:
    get:
      tags: [Portal Data]
      summary: List all events or get one by ID
      parameters:
        - in: query
          name: id
          schema: { type: integer }
          description: If provided, returns a single event
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      events: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  - type: object
                    properties:
                      event: { $ref: '#/components/schemas/Event' }
        "404": { description: Event not found }
        "500": { description: Server error }

    post:
      tags: [Portal Data]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                sim:         { type: string }
                status:      { type: string, default: upcoming }
                track:       { type: string }
                start_date:  { type: string }
                end_date:    { type: string }
                format:      { type: string }
                drivers:     { type: integer, default: 0 }
                max_drivers: { type: integer, default: 30 }
                rounds:      { type: integer, default: 1 }
                season:      { type: string }
                description: { type: string }
                track_mod:   { type: string }
                car_mod:     { type: string }
                practice_server: { type: string }
                car_options: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
        "500": { description: Server error }

    put:
      tags: [Portal Data]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
              additionalProperties: true
      responses:
        "200": { description: Updated }
        "400": { description: Missing ID or no fields }
        "404": { description: Event not found }

    delete:
      tags: [Portal Data]
      summary: Delete an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200": { description: Deleted }
        "404": { description: Event not found }

  # ── /api/leagues ─────────────────────────────────────────────────────────────
  /api/leagues:
    get:
      tags: [Portal Data]
      summary: List all leagues or get one by ID
      parameters:
        - in: query
          name: id
          schema: { type: integer }
      responses:
        "200": { description: Success }
        "404": { description: League not found }
    post:
      tags: [Portal Data]
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:           { type: string }
                sim:            { type: string }
                status:         { type: string, default: upcoming }
                start_date:     { type: string }
                end_date:       { type: string }
                format:         { type: string }
                season:         { type: string }
                championship_id: { type: string }
                simgrid_url:    { type: string, format: uri }
                blob_store:     { type: string }
                drivers:        { type: integer, default: 0 }
                max_drivers:    { type: integer, default: 36 }
                rounds:         { type: integer, default: 8 }
                track:          { type: string }
                description:    { type: string }
                car_options:    { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
    put:
      tags: [Portal Data]
      summary: Update a league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
      responses:
        "200": { description: Updated }
        "404": { description: League not found }
    delete:
      tags: [Portal Data]
      summary: Delete a league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200": { description: Deleted }
        "404": { description: League not found }

  # ── /api/leaderboard ─────────────────────────────────────────────────────────
  /api/leaderboard:
    get:
      tags: [Portal Data]
      summary: Get leaderboard entries
      parameters:
        - in: query
          name: id
          schema: { type: integer }
          description: Single entry by ID
        - in: query
          name: event_id
          schema: { type: integer }
          description: Filter by event
        - in: query
          name: race
          schema: { type: string }
          description: Filter by race name (use with event_id)
      responses:
        "200": { description: Success }
        "404": { description: Entry not found }
    post:
      tags: [Portal Data]
      summary: Create a leaderboard entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, driver, position]
              properties:
                event_id: { type: integer }
                race:     { type: string, default: "Race 1" }
                position: { type: integer }
                driver:   { type: string }
                tag:      { type: string }
                team:     { type: string }
                points:   { type: number }
                time:     { type: string }
                gap:      { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
    put:
      tags: [Portal Data]
      summary: Update a leaderboard entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
      responses:
        "200": { description: Updated }
        "404": { description: Entry not found }
    delete:
      tags: [Portal Data]
      summary: Delete entry by id or bulk-delete by event_id+race
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:       { type: integer, description: "Delete single entry" }
                event_id: { type: integer, description: "Bulk delete — use with race" }
                race:     { type: string, description: "Bulk delete — use with event_id" }
      responses:
        "200": { description: Deleted }
        "400": { description: Missing parameters }
        "404": { description: Entry not found }

  # ── /api/registrations ───────────────────────────────────────────────────────
  /api/registrations:
    get:
      tags: [Portal Data]
      summary: Get registrations
      parameters:
        - in: query
          name: id
          schema: { type: integer }
        - in: query
          name: event
          schema: { type: string }
          description: Filter by event name
        - in: query
          name: driver_tag
          schema: { type: string }
      responses:
        "200": { description: Success }
        "404": { description: Not found }

    post:
      tags: [Portal Data]
      summary: Create a registration or bulk-import drivers
      parameters:
        - in: query
          name: action
          schema: { type: string, enum: [bulk-import] }
          description: Use bulk-import to import from standings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - description: Single registration
                  type: object
                  required: [driver_tag, event]
                  properties:
                    driver_tag:     { type: string }
                    discord:        { type: string }
                    car_class:      { type: string }
                    event:          { type: string }
                    league_id:      { type: integer }
                    car_number:     { type: string }
                    penalty_points: { type: integer, default: 0 }
                - description: Bulk import body
                  type: object
                  required: [league_id, league_name, drivers]
                  properties:
                    league_id:   { type: integer }
                    league_name: { type: string }
                    drivers:
                      type: array
                      items:
                        type: object
                        properties:
                          driver_tag: { type: string }
                          discord:    { type: string }
                          car_class:  { type: string }
                          car_number: { type: string }
      responses:
        "200": { description: Bulk import result }
        "201": { description: Registration created }
        "409": { description: Duplicate registration }
        "400": { description: Validation error }

    put:
      tags: [Portal Data]
      summary: Update a registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
      responses:
        "200": { description: Updated }
        "404": { description: Not found }

    delete:
      tags: [Portal Data]
      summary: Delete a registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200": { description: Deleted }
        "404": { description: Not found }

  # ── /api/race-store ──────────────────────────────────────────────────────────
  /api/race-store:
    get:
      tags: [Race Archive]
      summary: List leagues, list races for a league, or fetch a specific race
      parameters:
        - in: query
          name: action
          schema: { type: string, enum: [leagues] }
          description: Use action=leagues to list all leagues that have stored races
        - in: query
          name: leagueId
          schema: { type: integer }
          description: League database ID
        - in: query
          name: timestamp
          schema: { type: integer }
          description: Race timestamp in ms — returns full result_data when combined with leagueId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - description: Leagues list
                    type: object
                    properties:
                      leagues: { type: array, items: { type: object } }
                  - description: Races for league
                    type: object
                    properties:
                      races: { type: array, items: { $ref: '#/components/schemas/RaceResultMeta' } }
                  - description: Single race with full data
                    $ref: '#/components/schemas/RaceResultFull'
        "404": { description: Race not found }

    post:
      tags: [Race Archive]
      summary: Store latest race or sync multiple races from Assetto server
      parameters:
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [store, sync] }
        - in: query
          name: leagueId
          schema: { type: integer }
          description: Required for action=store
      requestBody:
        content:
          application/json:
            schema:
              description: Required for action=sync
              type: object
              required: [leagueId, races]
              properties:
                leagueId: { type: integer }
                races:
                  type: array
                  items:
                    type: object
                    required: [results_json_url, track, date]
                    properties:
                      results_json_url: { type: string }
                      results_page_url: { type: string }
                      track:            { type: string }
                      date:             { type: string }
                      session_type:     { type: string, default: RACE }
      responses:
        "200": { description: Success }
        "400": { description: Missing parameters }
        "404": { description: No race found on Assetto server }

  # ── /api/races ───────────────────────────────────────────────────────────────
  /api/races:
    get:
      tags: [Assetto Proxy]
      summary: List RACE sessions or download a race result JSON from Assetto server
      parameters:
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [list, result] }
        - in: query
          name: file
          schema: { type: string }
          description: Required for action=result — filename like 2026_4_29_10_38_RACE.json
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: Missing action or file }
        "404": { description: No races found }
        "500": { description: Assetto server unreachable }

  # ── /api/live ────────────────────────────────────────────────────────────────
  /api/live:
    get:
      tags: [Assetto Proxy]
      summary: Live timing data from Assetto server
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [basic, leaderboard] }
          description: Omit to get both. basic=session info, leaderboard=driver positions
      responses:
        "200":
          description: Success (5s cache)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500": { description: Assetto server unreachable }

  # ── /api/standings ───────────────────────────────────────────────────────────
  /api/standings:
    get:
      tags: [Assetto Proxy]
      summary: Championship standings from Assetto server
      parameters:
        - in: query
          name: championshipId
          required: true
          schema: { type: string }
          example: 1bb2f11c-d4db-45e8-9505-97cd6ec1e806
      responses:
        "200":
          description: Success (60s cache)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: Missing championshipId }
        "500": { description: Assetto server unreachable }

  # ── /api/championships ───────────────────────────────────────────────────────
  /api/championships:
    get:
      tags: [Assetto Proxy]
      summary: List all championships from Assetto server
      responses:
        "200":
          description: Success (300s cache)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500": { description: Assetto server unreachable }

  # ── /api/results ─────────────────────────────────────────────────────────────
  /api/results:
    get:
      tags: [Assetto Proxy]
      summary: Full results list from Assetto server
      responses:
        "200":
          description: Success (120s cache)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500": { description: Assetto server unreachable }

  # ── /api/login-auth ──────────────────────────────────────────────────────────
  /api/login-auth:
    post:
      tags: [Admin]
      summary: Login or validate admin token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - description: Login
                  type: object
                  required: [username, password]
                  properties:
                    username: { type: string }
                    password: { type: string }
                - description: Validate token
                  type: object
                  required: [action, token]
                  properties:
                    action: { type: string, enum: [validate] }
                    token:  { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - description: Login success
                    type: object
                    properties:
                      success:   { type: boolean }
                      token:     { type: string, description: "base64Payload|HMACSig" }
                      username:  { type: string }
                      expiresIn: { type: integer, example: 7200 }
                  - description: Token valid
                    type: object
                    properties:
                      valid:     { type: boolean }
                      username:  { type: string }
                      expiresAt: { type: integer, description: Unix timestamp ms }
        "400": { description: Missing credentials }
        "401": { description: Invalid credentials or expired token }

  # ── /api/sync-poster ─────────────────────────────────────────────────────────
  /api/sync-poster:
    post:
      tags: [Admin]
      summary: Upload or update a poster image in the GitHub repository
      description: |
        Commits the image to the root of the repo using the GitHub Contents API.
        Filename must match: `poster<N>.png` or `leaguePoster<N>.png`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content]
              properties:
                filename:
                  type: string
                  pattern: '^(poster\d+|leaguePoster\d+)\.png$'
                  example: leaguePoster3.png
                content:
                  type: string
                  description: Base64-encoded image data
                message:
                  type: string
                  description: Optional commit message
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  commit:
                    type: object
                    properties:
                      sha:     { type: string }
                      url:     { type: string }
                      message: { type: string }
                  file:
                    type: object
                    properties:
                      name:         { type: string }
                      url:          { type: string }
                      download_url: { type: string }
        "400": { description: Missing or invalid parameters }
        "500": { description: GitHub token not configured or API error }
