        action:
          type: string
        driver_profile_id:
          type: integer
          nullable: true
        normalized_name:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
        admin_username:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
    LoginClaim:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
              pattern: ^[0-9]+$
          description: Database BIGSERIAL ID, possibly serialized as a string.
        driver_profile_id:
          type: integer
        discord_user_id:
          type: string
        discord_username:
          type: string
        discord_global_name:
          type: string
          nullable: true
        discord_avatar_hash:
          type: string
          nullable: true
        status:
          type: string
        reviewed_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        display_name:
          type: string
    MappingWorkspace:
      type: object
      required:
        - profiles
        - candidates
        - audit
        - claims
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/MappingProfile"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/DriverCandidate"
        audit:
          type: array
          items:
            $ref: "#/components/schemas/MappingAudit"
        claims:
          type: array
          items:
            $ref: "#/components/schemas/LoginClaim"
    DiscordMember:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        username:
          type: string
        globalName:
          type: string
        nickname:
          type: string
        avatarHash:
          type: string
        linkedProfileId:
          type: integer
          nullable: true
        linkedProfileName:
          type: string
        suggestedProfileId:
          type: integer
          nullable: true
        suggestedProfileName:
          type: string
        matchMethod:
          type: string
          enum:
            - discord_id
            - username
            - unmatched
    RaceMappingPreview:
      type: object
      required:
        - total
        - matched
        - unmatched
        - drivers
      properties:
        total:
          type: integer
        matched:
          type: integer
        unmatched:
          type: integer
        drivers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              matched:
                type: boolean
              profile:
                type: string
                nullable: true
    LmuUploadPreview:
      type: object
      required:
        - preview
        - hash
      properties:
        preview:
          type: object
          required:
            - leagueId
            - leagueName
            - race
            - result
            - validation
            - mapping
          properties:
            leagueId:
              type: integer
            leagueName:
              type: string
            race:
              $ref: "#/components/schemas/SimGridRace"
            result:
              $ref: "#/components/schemas/RaceData"
            validation:
              type: object
              required:
                - valid
                - warnings
                - hoursApart
                - trackMatched
              properties:
                valid:
                  type: boolean
                warnings:
                  type: array
                  items:
                    type: string
                hoursApart:
                  type: number
                trackMatched:
                  type: boolean
            mapping:
              $ref: "#/components/schemas/RaceMappingPreview"
        hash:
          type: string
    LmuUploadResult:
      type: object
      required:
        - success
        - raceId
        - drivers
        - storedAt
        - syncedBy
      properties:
        success:
          type: boolean
        raceId:
          type: string
        drivers:
          type: integer
        storedAt:
          type: string
          format: date-time
          nullable: true
        syncedBy:
          type: string
paths:
  /api/discord-auth:
    get:
      tags:
        - Driver Portal
      summary: Start or complete Discord OAuth, inspect login state, or sign out
      description: action=login redirects to Discord with identify scope and a ten-minute srt_discord_state cookie.
        The callback verifies state and looks up an already-linked immutable Discord user ID, then falls back
        to an exact approved username. A username-only match creates a pending claim requiring admin approval;
        it does not sign the driver in. An approved ID match issues the seven-day driver cookie. Login and
        callback errors redirect to profile.html?error=...; pending claims redirect to
        profile.html?claim=pending. action=me only validates the signed cookie and does not recheck the
        database link; driver-profile does. action=logout clears the driver cookie and redirects to /.
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum:
              - login
              - callback
              - me
              - logout
            default: me
        - in: query
          name: code
          schema:
            type: string
          description: Discord callback authorization code.
        - in: query
          name: state
          schema:
            type: string
          description: Discord callback state; must match the srt_discord_state cookie.
      responses:
        "200":
          description: Login state
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                  profileId:
                    type: integer
                    description: Only present when authenticated.
        "302":
          description: Redirect to Discord, profile (including errors/pending claims), or home on logout.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: Sets or clears signed state/session cookies.
