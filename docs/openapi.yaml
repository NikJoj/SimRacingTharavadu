  /api/driver-mappings:
    get:
      tags:
        - Admin
      summary: List driver identity profiles, discovered names, and mapping audit
      security:
        - AdminSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingWorkspace"
        "401":
          description: Invalid or expired admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mapping workspace could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: JWT_SECRET is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getDriverMappings
    post:
      tags:
        - Admin
      summary: Manage driver mappings and pre-link Discord server members
      security:
        - AdminSession: []
      description: >-
        `index` rebuilds the searchable race-entry index without changing archived

        race JSON. `assign` creates or selects a driver profile and approves the

        discovered name as a global alias. `unassign` reverses that alias link.

        `update-profile` edits the administrative display name and expected Discord

        username. `preview-discord-members` securely fetches non-bot members through

        the configured SRT bot and suggests exact username matches without writing.

        `confirm-discord-members` revalidates server membership and binds selected

        immutable Discord user IDs, allowing those drivers to sign in immediately.

        A link can target an existing profile or an unmatched discovered racing

        name; the latter creates the profile, approves the alias, and backfills

        historical race entries and registrations in the same operation.


        review-claim approves or rejects a pending Discord login claim. unlink-discord-member requires
        profileId and the currently linked discordUserId and clears the login link. Member confirmation
        revalidates membership; operations use sequential database writes, not an all-or-nothing batch
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - action
                  properties:
                    action:
                      type: string
                      enum:
                        - index
                - type: object
                  required:
                    - action
                  properties:
                    action:
                      type: string
                      enum:
                        - preview-discord-members
                - type: object
                  required:
                    - action
                    - candidateId
                  properties:
                    action:
                      type: string
                      enum:
                        - assign
                    candidateId:
                      type: integer
                      minimum: 1
                    profileId:
                      type: integer
                      minimum: 1
                    displayName:
                      type: string
                    discordUsername:
                      type: string
                  description: "Without profileId, creates a profile: discordUsername is required and displayName defaults to
                    the discovered sample name."
                - type: object
                  required:
                    - action
                    - candidateId
                  properties:
                    action:
                      type: string
                      enum:
                        - unassign
                    candidateId:
                      type: integer
                      minimum: 1
                - type: object
                  required:
                    - action
                    - profileId
                    - displayName
                    - discordUsername
                  properties:
                    action:
                      type: string
                      enum:
                        - update-profile
                    profileId:
                      type: integer
                      minimum: 1
                    displayName:
                      type: string
                    discordUsername:
                      type: string
                - type: object
                  required:
                    - action
                    - claimId
                    - decision
                  properties:
                    action:
                      type: string
                      enum:
                        - review-claim
                    claimId:
                      type: integer
                      minimum: 1
                    decision:
                      type: string
                      enum:
                        - approve
                        - reject
                - type: object
                  required:
                    - action
                    - profileId
                    - discordUserId
                  properties:
                    action:
                      type: string
                      enum:
                        - unlink-discord-member
                    profileId:
                      type: integer
                      minimum: 1
                    discordUserId:
                      type: string
                      pattern: ^[0-9]+$
                - type: object
                  required:
                    - action
                    - links
                  properties:
                    action:
                      type: string
                      enum:
                        - confirm-discord-members
                    links:
                      type: array
                      items:
                        type: object
                        required:
                          - memberId
                        properties:
                          memberId:
                            type: string
                            pattern: ^[0-9]+$
                          profileId:
                            type: integer
                            minimum: 1
                          candidateId:
                            type: integer
                            minimum: 1
                        oneOf:
                          - required:
                              - profileId
                          - required:
                              - candidateId
                      minItems: 1
                      maxItems: 500
      responses:
        "200":
          description: "Action-specific result: index returns races/entries; preview returns members; confirm returns
            linked; assign returns profileId; unlink returns profileId/displayName; other actions return
            success."
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                  profileId:
                    type: integer
                  displayName:
                    type: string
                  linked:
                    type: integer
                  races:
                    type: integer
                  entries:
                    type: integer
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscordMember"
        "400":
          description: Invalid action or fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Candidate or profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Discord username or provider identity conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Discord rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Mapping operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Discord bot request or permission failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Discord bot token or guild ID is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: postDriverMappings
    options:
      tags:
        - Admin
      operationId: optionsDriverMappings
      summary: Handle preflight request
      security: []
      responses:
        "204":
          description: Empty preflight response
  /api/simgrid-results:
    post:
      tags:
        - Admin
      summary: Preview or confirm an uploaded LMU XML race result
      security:
        - AdminSession: []
      description: Accepts an LMU/rFactor XML file up to 8 MiB (8,388,608 UTF-8 bytes). Preview normalizes the Race
        summary and compares its timestamp (within 36 hours) and track words against the selected saved
        SimGrid race, returning validation warnings and driver mapping suggestions. Preview may succeed with
        validation.valid=false; sync rejects that preview. Sync requires the same file/selection/hash, upserts
        the league and scheduled race timestamp, then indexes drivers. This endpoint does not preserve raw
        XML, individual laps/sectors, or incident/penalty events. Social-race backfills retain additional data
        through a separate offline process. SimGrid remains the source of championship points. Archive write
        and driver indexing are sequential; a later indexing failure can occur after the archive has been
        saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - action
                - leagueId
                - raceId
                - file
              properties:
                action:
                  type: string
                  enum:
                    - preview
                    - sync
                leagueId:
                  type: integer
                  minimum: 1
                raceId:
                  type: string
                  pattern: ^[0-9]+$
                hash:
                  type: string
                  description: Required for sync; returned by preview
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LmuUploadPreview"
                  - $ref: "#/components/schemas/LmuUploadResult"
        "400":
          description: Missing selection, invalid filename, upload, or XML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: League not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Championship not synced or preview changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid results or date/track mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload, storage, or indexing failed. The archive may already have been saved if a later indexing
            step failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: JWT_SECRET is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: postSimgridResults
    options:
      tags:
        - Admin
      operationId: optionsSimgridResults
      summary: Handle preflight request
      security: []
      responses:
        "204":
          description: Empty preflight response
